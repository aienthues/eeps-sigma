title: File Created In Root-Level C:\Microsoft\Vault Folder
id: 496a3089-cdbd-4081-a814-6ddfab7ecb81
status: experimental
description: |
    Detects creation of a file beneath C:\Microsoft\Vault, a root-level folder that mimics a Windows component location.
    Check Point reports that the Aokigahara infostealer's clipper_drop handler "Drops a clipper component beneath `C:\Microsoft\Vault` using embedded data";
    "The handler itself does not access the clipboard; it deploys the component responsible for clipboard manipulation."
    Assumption, not from the report: Windows keeps its genuine Vault folders under user and ProgramData profile paths (for example %LOCALAPPDATA%\Microsoft\Vault), not at C:\Microsoft\, so
    the rule anchors on the drive-root path. The report does not name the dropped file, so the rule matches any file in the folder.
references:
    - https://research.checkpoint.com/2026/infostealer-riding-the-ai-train/
author: Esmond Er
date: 2026-10-24
modified: 2026-10-24
tags:
    - attack.collection
    - attack.t1115
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|startswith: 'C:\Microsoft\Vault\'
    condition: selection
falsepositives:
    - None known; legacy or in-house software that creates a C:\Microsoft folder at the drive root (review the writing process)
level: high
