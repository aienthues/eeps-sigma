title: Suspicious File Written To Oracle PeopleSoft Web Application Archive Directory - Windows
id: 9b7fe84e-31fe-495f-8715-59b7e97c7c75
status: experimental
description: |
    Detects creation of JSP, JSPX or EXE files inside the PeopleSoft PSEMHUB.war or PORTAL.war web application directories.
    UNC6240 (ShinyHunters) exploited PSEMHUB (CVE-2026-35273), wrote web shells (x.jsp, u.jsp and sequentially numbered JSPs) and other unexpected files such as tunnel.jsp and tunnel.jspx into PSEMHUB.war, then uploaded Ple64.exe, a trojanized installer delivering the SIDEEYE backdoor, in chunks through u.jsp and reassembled it in the same directory.
    The report does not name the process that writes these files, so the rule does not filter on Image.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft
author: Esmond Er
date: 2026-09-26
modified: 2026-09-28
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.command-and-control
    - attack.t1105
logsource:
    product: windows
    category: file_event
detection:
    selection_dir:
        TargetFilename|contains:
            - '\applications\peoplesoft\PSEMHUB.war\'
            - '\applications\peoplesoft\PORTAL.war\'
    selection_ext:
        TargetFilename|endswith:
            - '.jsp'
            - '.jspx'
            - '.exe'
    condition: all of selection_*
falsepositives:
    - PeopleTools patching, PIA redeployment or PeopleSoft Update Manager runs that rewrite JSPs in PORTAL.war (correlate with change windows)
level: high
