title: Aokigahara Infostealer Kmd_w_ Staging Database File Created
id: 519b664a-86ee-47b6-84f7-444445583093
status: experimental
description: |
    Detects creation of a file named kmd_w_<number>_<number>.db.
    Check Point's YARA rule for the Aokigahara infostealer contains the format string $str10 = "%s\\kmd_w_%d_%d.db", a .db file written into a folder that the report does not name.
    The rule matches the verbatim file-name pattern with %d as decimal digits and ignores the folder. The report does not describe the file's purpose;
    a staging copy of a locked SQLite store is an analyst inference.
references:
    - https://research.checkpoint.com/2026/infostealer-riding-the-ai-train/
author: Esmond Er
date: 2026-10-24
modified: 2026-10-24
tags:
    - attack.collection
    - attack.t1074.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|re: '\\kmd_w_[0-9]+_[0-9]+\.db$'
    condition: selection
falsepositives:
    - None known; an application that names database files with a kmd_w_ prefix and two numbers
level: medium
