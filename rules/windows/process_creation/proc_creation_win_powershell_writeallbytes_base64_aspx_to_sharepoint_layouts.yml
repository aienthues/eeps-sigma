title: PowerShell Writes Base64-Decoded ASPX File To SharePoint Layouts Directory
id: 5d9520c3-ea4a-42b3-a54a-dc101b23a161
status: experimental
description: |
    Detects a PowerShell command line that decodes Base64 content with FromBase64String and writes it with WriteAllBytes to an .aspx file under a SharePoint TEMPLATE\LAYOUTS directory.
    Symantec reports that after ToolShell exploitation the Warlock ransomware attackers installed a webshell on a SharePoint server with
    powershell -nop -c "[IO.File]::WriteAllBytes('...\microsoft shared\web server extensions\14\template\layouts\layout2sp.aspx',[Convert]::FromBase64String(...".
    The rule matches any SharePoint version folder; the observed write targeted the \14\ hive, which the SigmaHQ layouts file-write rules (\15\ and \16\ only) do not cover.
references:
    - https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure
author: Esmond Er
date: 2026-10-04
modified: 2026-10-04
tags:
    - attack.persistence
    - attack.t1505.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\powershell.exe'
        - OriginalFileName: 'PowerShell.EXE'
    selection_cli:
        CommandLine|contains|all:
            - '::WriteAllBytes('
            - '::FromBase64String'
            - '\template\layouts\'
            - '.aspx'
    condition: all of selection_*
falsepositives:
    - SharePoint customisation or deployment scripts that drop an .aspx page into the layouts folder from an inline Base64 blob (normal deployments use WSP solution packages instead)
level: high
