title: Tar Extraction Of File With PDF Extension
id: e755961b-5c76-44dd-bd1d-af578e972fc3
related:
    - id: bf361876-6620-407a-812f-bfe11e51e924
      type: similar
status: experimental
description: |
    Detects the built-in Windows tar.exe (bsdtar) extracting an archive whose command line references a .pdf file, i.e. a ZIP or other archive disguised with a PDF extension.
    Huntress reports an Amazon-themed ClickFix campaign where the script "places the IronPython ZIP file in the user's Temp directory, as a file with a .pdf extension"
    and "then uses the tar command (which is now a part of modern Windows installations) to unpack the .zip". A PDF document cannot be extracted by tar, so a tar
    extraction naming a .pdf is file-type masquerading.
    The report does not publish the tar arguments; matching the .pdf name on the tar command line assumes the archive is unpacked under its disguised name.
references:
    - https://www.huntress.com/blog/amazon-clickfix-finger
author: Esmond Er
date: 2026-10-22
modified: 2026-10-22
tags:
    - attack.stealth
    - attack.t1036.008
    - attack.t1140
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\tar.exe'
        - OriginalFileName: 'bsdtar'
    selection_extract:
        CommandLine|contains:
            - '-x'
            - ' x'
            - '--extract'
    selection_pdf:
        CommandLine|contains: '.pdf'
    condition: all of selection_*
falsepositives:
    - Extracting a single named member that is a real PDF from a tar or zip archive (e.g. tar -xf docs.zip manual.pdf); check whether the archive argument itself ends in .pdf
level: medium
