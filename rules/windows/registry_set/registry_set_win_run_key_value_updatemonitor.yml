title: Run Key Value UpdateMonitor Set
id: 2c458e43-28de-4d8c-9d79-4f3f46c1de5b
status: experimental
description: |
    Detects a CurrentVersion\Run value named UpdateMonitor being set.
    ESET reports that "MATCHBOIL persists MATCHWOK by adding the registry value UpdateMonitor to the registry key HKCU\Software\Microsoft\Windows\CurrentVersion\Run\"
    (UAC-0099). The value data (MATCHWOK path) is not published, so the rule keys on the value name.
    Sysmon logs HKCU as HKU\<SID>, hence endswith matching on the key path below the hive.
references:
    - https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/
author: Esmond Er
date: 2026-10-23
modified: 2026-10-23
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Run\UpdateMonitor'
    condition: selection
falsepositives:
    - Third-party software that registers an autostart value named UpdateMonitor; check the value data points to a signed binary in that vendor's install folder
level: medium
