title: NeedyMantis Loader DLL Sideload From Masquerading Folder
id: fe751fc0-0e2b-46c1-b7ca-e41b02f3e98e
status: experimental
description: |
    Detects loading of a DLL from one of the folder/file pairs Microsoft lists as used by the first-stage loader of the NeedyMantis malware family (used by at least Storm-3069).
    The loader masquerades as a DLL required by legitimate open-source software (curl, Vim, TightVNC and others) packaged alongside it and is loaded through DLL sideloading
    from vendor-lookalike folders under ProgramData or Program Files (e.g. ProgramData\USOShared\libcurl.dll, ProgramData\VIM\vim64.dll, ProgramData\ics\nvml.dll).
    Scope decisions: the reported ProgramData\Intel\jli.dll and ProgramData\office|broadcom\dbghelp.dll loads are omitted because SigmaHQ's generic jli.dll and dbghelp.dll sideloading rules already alert on them;
    Program Files\Poedit\WinSparkle.dll is omitted because it is the legitimate install path of Poedit's WinSparkle update component and the report gives no signer or hash to tell the spoofed copy apart.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
author: Esmond Er
date: 2026-09-30
modified: 2026-10-01
tags:
    - attack.stealth
    - attack.t1574.001
logsource:
    category: image_load
    product: windows
detection:
    selection:
        ImageLoaded|endswith:
            - '\ProgramData\USOShared\libcurl.dll'
            - '\ProgramData\VIM\vim64.dll'
            - '\ProgramData\TightVNC\VIM\vim64.dll'
            - '\ProgramData\ics\nvml.dll'
            - '\Program Files\modifiable\nvml.dll'
            - '\Program Files (x86)\modifiable\nvml.dll'
    condition: selection
falsepositives:
    - Portable or repackaged builds of curl, Vim or TightVNC deliberately unpacked by an administrator into C:\ProgramData\USOShared, C:\ProgramData\VIM or C:\ProgramData\TightVNC\VIM (none of these are default install locations)
    - Software that ships nvml.dll (NVIDIA Management Library) installed into a folder literally named "modifiable" or "ics"; verify the loading process and DLL signer
level: high
