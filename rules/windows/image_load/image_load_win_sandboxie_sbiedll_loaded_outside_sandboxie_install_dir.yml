title: Sandboxie SbieDll.DLL Loaded From Outside Sandboxie Install Directory
id: c50b437c-c722-4e27-a963-ddc4a2891f1c
status: experimental
description: |
    Detects a process loading a DLL named sbiedll.dll from a location other than the default Sandboxie / Sandboxie-Plus install directory, a DLL sideloading pattern.
    Sophos X-Ops reports that BRONZE SANDCASTLE placed "legitimate Sandboxie executables ... alongside a malicious sbiedll.dll file" (SandboxieWUAU.exe, and a
    renamed Sandboxie executable named Start.exe) so that the signed binary loads the attacker DLL, which then decrypts and runs a Meterpreter-based payload from config.ini.
    The selection keys on the DLL rather than the host image because the actor renamed one of the hosts and because legitimate Sandboxie injects SbieDll.dll into every
    sandboxed process, so only the DLL location separates good from bad. The report gives no folder paths; the filtered folders are an ASSUMPTION based on the
    well-known Sandboxie Classic (C:\Program Files\Sandboxie\) and Sandboxie-Plus (C:\Program Files\Sandboxie-Plus\) default install locations.
references:
    - https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells
author: Esmond Er
date: 2026-10-21
modified: 2026-10-21
tags:
    - attack.stealth
    - attack.t1574.001
logsource:
    category: image_load
    product: windows
detection:
    selection:
        ImageLoaded|endswith: '\sbiedll.dll'
    filter_main_install_dir:
        ImageLoaded|startswith:
            - 'C:\Program Files\Sandboxie\'
            - 'C:\Program Files\Sandboxie-Plus\'
            - 'C:\Program Files (x86)\Sandboxie\'
            - 'C:\Program Files (x86)\Sandboxie-Plus\'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Sandboxie or Sandboxie-Plus installed to a custom (non-default) directory or run as a portable copy; every sandboxed process will then load SbieDll.dll from that folder - add the folder as a filter after confirming the DLL is signed by the Sandboxie developer
    - Malware-analysis or QA hosts that copy Sandboxie binaries into working folders
level: high
