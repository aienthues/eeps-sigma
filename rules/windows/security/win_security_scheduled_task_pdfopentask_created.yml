title: Scheduled Task PdfOpenTask Created Or Updated
id: 4defba27-5c72-44ce-adb3-278e9dfca000
status: experimental
description: |
    Detects creation or update (Security events 4698/4702) of a scheduled task named pdfopentask.
    ESET reports, for the intrusion it investigated at the target organization, that "a scheduled task named pdfopentask was executed on one machine
    in the target organization" and that "It executed a PowerShell payload from %temp%\temporarydoc.txt".
    The task name is an attacker-chosen artifact; requires "Audit Other Object Access Events" to be enabled.
references:
    - https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/
author: Esmond Er
date: 2026-10-23
modified: 2026-10-24
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID:
            - 4698
            - 4702
        TaskName|endswith: '\pdfopentask'
    condition: selection
falsepositives:
    - A PDF reader or document tool that registers a task with this exact name; none known, confirm the task's action and author
level: high
