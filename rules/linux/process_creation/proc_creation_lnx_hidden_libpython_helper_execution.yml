title: Hidden Executable In x86_64-linux-gnu Library Directory Or .libpython-helper Executed - Linux
id: e4038c8f-e47d-4dd2-b198-267530e52235
status: experimental
description: |
    Detects execution of a hidden (dot-prefixed) executable from /usr/lib/x86_64-linux-gnu/, or of any binary named .libpython-helper.
    Unit 42 reports that CL-UNK-1211 copied a Python interpreter and "renamed it to .libpython-helper to execute shell commands with high privileges".
    The extracted observables place it at /usr/lib/x86_64-linux-gnu/.libpython-helper. The name is attacker-chosen; the
    behavioural branch covers the same placement (a hidden executable among shared libraries) under any name.
references:
    - https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/
author: Esmond Er
date: 2026-10-16
modified: 2026-10-17
tags:
    - attack.stealth
    - attack.t1036.003
    - attack.t1564.001
logsource:
    category: process_creation
    product: linux
detection:
    selection_hidden_libdir:
        Image|startswith: '/usr/lib/x86_64-linux-gnu/'
        Image|contains: '/.'
    selection_name:
        Image|endswith: '/.libpython-helper'
    condition: 1 of selection_*
falsepositives:
    - Third-party agents or vendor installers that unpack hidden helper executables into /usr/lib/x86_64-linux-gnu/ (check package ownership with dpkg -S and baseline)
    - Package build or test chroots that run temporary hidden binaries from the library directory
level: medium
