title: Inline Python Command Reading LiteLLM Proxy Database Credential Tables - Linux
id: 793141aa-c69b-4007-b703-0ea014a31f6e
status: experimental
description: |
    Detects an inline Python command (python -c) that runs a Prisma raw query against the LiteLLM proxy database tables that hold provider credentials and model settings.
    Microsoft reports that the PRIVCOLLECT collector shipped in the trojanized LiteLLM 1.107.0 package "starts a Python child using Prisma to read selected fields
    from two proxy database tables" (LiteLLM_CredentialsTable.credential_values and LiteLLM_ProxyModelTable.litellm_params).
    The rule uses the command-line terms from Microsoft's own hunting query ("-c ", "query_raw" and the table names).
    The LiteLLM proxy reads these tables inside its own long-running process, not through a separate python -c child, so a match is unusual.
    The rule keys on the query behaviour, not on file hashes or the exfiltration domain, so it should still match if the collector is repackaged.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
author: Esmond Er
date: 2026-10-24
modified: 2026-10-24
tags:
    - attack.execution
    - attack.t1059.006
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: linux
detection:
    selection_inline:
        CommandLine|contains|all:
            - '-c '
            - 'query_raw'
    selection_table:
        CommandLine|contains:
            - 'LiteLLM_CredentialsTable'
            - 'LiteLLM_ProxyModelTable'
    condition: all of selection_*
falsepositives:
    - LiteLLM administrators or developers running one-off python -c commands to inspect or migrate stored credentials or model settings in the proxy database
    - LiteLLM maintenance or migration scripts that pass Prisma raw queries on the command line
level: high
