title: Sshpass Inline Password With Host Key Checking Disabled - Linux
id: c52794ce-61c7-44b2-8175-05f34e03f085
status: experimental
description: |
    Detects sshpass supplying a password on the command line ("sshpass -p", including the -pPASSWORD form) to an SSH session that disables host key verification (StrictHostKeyChecking=no).
    Unit 42 reports that CL-UNK-1211 moved laterally between Linux servers with
    "sshpass -p [PASSWORD] ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 [USERNAME]@[IP_ADDRESS] [COMMAND] 2>&1".
    The combination lets a script push commands to many hosts with harvested credentials without interactive prompts.
    The 'sshpass -p' match is a case-sensitive regex so the -P (prompt string) option is excluded.
references:
    - https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/
author: Esmond Er
date: 2026-10-16
modified: 2026-10-17
tags:
    - attack.lateral-movement
    - attack.t1021.004
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '/sshpass'
        CommandLine|re: 'sshpass\s+-p'
        CommandLine|contains: 'StrictHostKeyChecking=no'
    condition: selection
falsepositives:
    - CI/CD runners (e.g. Jenkins agents, GitLab runners) whose jobs use sshpass with an inline password to deploy to hosts
    - Provisioning or imaging hosts that push commands to freshly built servers whose host keys are not yet known (baseline the source accounts and hosts)
level: medium
