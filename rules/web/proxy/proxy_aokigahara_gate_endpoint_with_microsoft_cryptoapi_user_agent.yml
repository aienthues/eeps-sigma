title: Request To Infostealer Gate Upload Endpoint With Microsoft-CryptoAPI User-Agent
id: 77a008e6-ee1b-4f2c-9223-12bb1dab8ced
related:
    - id: d1065103-0b01-4870-a766-b175a5604026
      type: derived
status: experimental
description: |
    Detects HTTP requests to /gate/handshake, /gate/chunk or /gate/complete sent with the User-Agent Microsoft-CryptoAPI/10.0.
    Check Point reports that the Aokigahara infostealer uses three /gate endpoints: handshake "Establishes an upload session by sending the client’s raw 32-byte X25519 public key",
    chunk "Uploads collected information packaged into ZIP archives and encrypted using AES-256-GCM", and complete "Signals the end of the upload phase by sending the eight-byte marker `COMPLETE`";
    "The latest analyzed samples use `Microsoft-CryptoAPI/10.0` for communication with the server."
    Windows uses Microsoft-CryptoAPI/10.0 for its own certificate revocation and trust-list downloads, so the user agent alone is not suspicious; the rule requires both the user agent and one of the
    three gate paths. If C2 traffic is HTTPS the rule needs proxy or TLS-inspection logs that record the URI. Earlier samples used a different user agent and will not match.
references:
    - https://research.checkpoint.com/2026/infostealer-riding-the-ai-train/
author: Esmond Er
date: 2026-10-24
modified: 2026-10-24
tags:
    - attack.command-and-control
    - attack.t1071.001
    - attack.exfiltration
    - attack.t1041
logsource:
    category: proxy
detection:
    selection:
        c-useragent: 'Microsoft-CryptoAPI/10.0'
        c-uri|endswith:
            - '/gate/handshake'
            - '/gate/chunk'
            - '/gate/complete'
    condition: selection
falsepositives:
    - None known; Windows CryptoAPI fetches certificate revocation lists and trust lists, not /gate/ paths
level: high
